<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="delivery_profile_page_title">My Profile - Smart Cafeteria</title>

    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="/src/css/delivery.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">

    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar delivery-sidebar" id="deliverySidebar"></aside>
        <main class="admin-main">

            <div class="delivery-header">
                <h1><i class="fa-solid fa-user"></i> <span data-i18n="delivery_profile">My Profile</span></h1>
            </div>

            <div id="profileAlert" class="alert-banner" style="display:none;"></div>

            <div class="card" style="padding:24px; margin-bottom:20px;">
                <div class="text-center">
                    <div class="avatar profile-avatar mx-auto mb-3" id="profileAvatar">D</div>
                    <h3 id="profileName" style="margin:10px 0 4px;">Delivery Staff</h3>
                    <p class="form-text" id="profileEmail" style="color:#64748b;">delivery@cafeteria.com</p>
                    <span class="badge badge-warning" id="profileRole">DELIVERY STAFF</span>
                </div>
            </div>

            <div class="card" style="padding:24px;">
                <h4 style="margin-top:0;"><i class="fa-solid fa-key" style="color:#f97316;"></i> Change Password</h4>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="currentPassword" class="form-label">Current Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="currentPassword" class="form-control" required autocomplete="current-password">
                            <i class="fa-regular fa-eye toggle-password-icon" data-target="currentPassword" title="Show password"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="newPassword" class="form-label">New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="newPassword" class="form-control" required autocomplete="new-password">
                            <i class="fa-regular fa-eye toggle-password-icon" data-target="newPassword" title="Show password"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" class="form-control" required autocomplete="new-password">
                            <i class="fa-regular fa-eye toggle-password-icon" data-target="confirmPassword" title="Show password"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="changePasswordBtn" form="passwordForm">
                        <i class="fa-solid fa-key"></i> Update Password
                    </button>
                </form>
            </div>

        </main>
    </div>

    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/delivery-layout.js"></script>
    <script type="module" src="../../js/api.js"></script>
    <script type="module" src="../../js/delivery/profile.js"></script>
    <script type="module" src="../../js/components/unified-header.js"></script>

    <script>
        function initPageSpecific() {}
    </script>
</body>
</html>
