<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="delivery_deliveries_page_title">Active Deliveries - Smart Cafeteria</title>

    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="/src/css/delivery.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">

    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar delivery-sidebar" id="deliverySidebar"></aside>
        <main class="admin-main">

            <div class="delivery-header">
                <h1><i class="fa-solid fa-truck-fast"></i> <span data-i18n="delivery_active_deliveries">Active Deliveries</span></h1>
                <div class="page-actions">
                    <button type="button" class="btn btn-secondary" id="refreshBtn"><i class="fa-solid fa-rotate"></i> <span data-i18n="admin_refresh">Refresh</span></button>
                </div>
            </div>

            <div id="errorBanner" class="error-banner" style="display:none;"></div>

            <div class="stats-row">
                <div class="stat-card"><div class="num" id="statReady">0</div><div class="lbl">Ready for Pickup</div></div>
                <div class="stat-card"><div class="num" id="statOut">0</div><div class="lbl">Out for Delivery</div></div>
                <div class="stat-card"><div class="num" id="statAssignedMe">0</div><div class="lbl">Assigned to Me</div></div>
            </div>

            <div class="delivery-tabs">
                <button type="button" class="tab-btn" data-filter="ready"><i class="fa-solid fa-box-open"></i> Ready for Delivery</button>
                <button type="button" class="tab-btn" data-filter="picked"><i class="fa-solid fa-hand-holding-hand"></i> Picked Up</button>
                <button type="button" class="tab-btn" data-filter="out"><i class="fa-solid fa-truck"></i> Out for Delivery</button>
                <button type="button" class="tab-btn active" data-filter="all"><i class="fa-solid fa-list"></i> All</button>
            </div>

            <div class="section-title"><h3><i class="fa-solid fa-boxes-stacked" style="color:#f97316;"></i> Delivery Queue</h3></div>
            <div class="delivery-list" id="deliveryList">
                <div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No delivery orders at the moment.</p></div>
            </div>

        </main>
    </div>

    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/delivery-layout.js"></script>
    <script type="module" src="../../js/api.js"></script>
    <script type="module" src="../../js/socket.js"></script>
    <script type="module" src="../../js/delivery/deliveries.js"></script>
    <script type="module" src="../../js/components/unified-header.js"></script>

    <script>
        function initPageSpecific() {}
    </script>
</body>
</html>
