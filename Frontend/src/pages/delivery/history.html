<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="delivery_history_page_title">My Delivery History - Smart Cafeteria</title>

    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="/src/css/delivery.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">

    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar delivery-sidebar" id="deliverySidebar"></aside>
        <main class="admin-main">

            <div class="delivery-header">
                <h1><i class="fa-solid fa-clock-rotate-left"></i> <span data-i18n="delivery_history">My History</span></h1>
                <div class="page-actions">
                    <button type="button" class="btn btn-secondary" id="refreshBtn"><i class="fa-solid fa-rotate"></i> <span data-i18n="admin_refresh">Refresh</span></button>
                </div>
            </div>

            <div id="errorBanner" class="error-banner" style="display:none;"></div>

            <div class="stats-row">
                <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">Total Delivered</div></div>
                <div class="stat-card"><div class="num" id="statToday">0</div><div class="lbl">Delivered Today</div></div>
                <div class="stat-card"><div class="num" id="statCollected">0.00 ETB</div><div class="lbl">Collected (All Time)</div></div>
            </div>

            <div class="section-title"><h3><i class="fa-solid fa-receipt" style="color:#64748b;"></i> My Completed Deliveries</h3></div>
            <div id="historyContainer">
                <div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>No delivered orders yet.</p></div>
            </div>

        </main>
    </div>

    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/delivery-layout.js"></script>
    <script type="module" src="../../js/api.js"></script>
    <script type="module" src="../../js/socket.js"></script>
    <script type="module" src="../../js/delivery/history.js"></script>
    <script type="module" src="../../js/components/unified-header.js"></script>

    <script>
        function initPageSpecific() {}
    </script>
</body>
</html>
