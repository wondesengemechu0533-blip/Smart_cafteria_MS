<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="delivery_dashboard_page_title">Delivery Dashboard - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="/public/assets/vendor/fontawesome/css/all.min.css">

    <!-- Shared Stylesheets -->
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="/src/css/admin.css">
    <link rel="stylesheet" href="/src/css/delivery.css">
    <link rel="stylesheet" href="../../css/themes/dark-theme.css">
    <script src="../../js/theme.js"></script>
</head>
<body class="admin-body">

    <!-- Layout is injected by delivery-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar delivery-sidebar" id="deliverySidebar"></aside>
        <main class="admin-main">

            <div class="delivery-header">
                <h1><i class="fa-solid fa-truck-fast"></i> <span data-i18n="delivery_dashboard">Delivery Dashboard</span></h1>
                <div class="page-actions">
                    <button type="button" class="btn btn-secondary" id="refreshBtn"><i class="fa-solid fa-rotate"></i> <span data-i18n="admin_refresh">Refresh</span></button>
                </div>
            </div>

            <div id="errorBanner" class="error-banner" style="display:none;"></div>

            <div class="stats-row">
                <div class="stat-card"><div class="num" id="statMyActive">0</div><div class="lbl">My Active Deliveries</div></div>
                <div class="stat-card"><div class="num" id="statMyOut">0</div><div class="lbl">Out for Delivery</div></div>
                <div class="stat-card"><div class="num" id="statMyDelivered">0</div><div class="lbl">Delivered (All Time)</div></div>
            </div>

            <div class="delivery-tabs">
                <button type="button" class="tab-btn active" id="navActive"><i class="fa-solid fa-truck-fast"></i> Active Deliveries</button>
                <button type="button" class="tab-btn" id="navHistory"><i class="fa-solid fa-clock-rotate-left"></i> My History</button>
            </div>

            <div id="activeSection">
                <div class="section-title"><h3><i class="fa-solid fa-truck-fast" style="color:#f97316;"></i> My Active Deliveries</h3></div>
                <div class="delivery-list" id="activeList">
                    <div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No active deliveries assigned to you right now.</p></div>
                </div>
            </div>

            <div id="historySection" style="display:none;">
                <div class="section-title"><h3><i class="fa-solid fa-clock-rotate-left" style="color:#64748b;"></i> My Delivery History</h3></div>
                <div id="historyContainer">
                    <div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>No delivered orders yet.</p></div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="/public/assets/vendor/js/socket.io-4.7.5.min.js"></script>
    <script src="../../js/config.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/delivery-layout.js"></script>
    <script type="module" src="../../js/api.js"></script>
    <script type="module" src="../../js/socket.js"></script>
    <script type="module" src="../../js/delivery/dashboard.js"></script>
    <script type="module" src="../../js/components/unified-header.js"></script>

    <script>
        // Page-specific initialization hook (called by delivery-layout.js)
        function initPageSpecific() {
            // dashboard.js handles its own DOMContentLoaded logic
        }
    </script>
</body>
</html>
