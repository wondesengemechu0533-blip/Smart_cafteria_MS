<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Smart Cafeteria</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap CSS (required for grid + components) -->

    <!-- Admin CSS stylesheet -->
    <link rel="stylesheet" href="/src/css/admin.css">
</head>
<body class="admin-body">

    <!-- Layout will be injected by admin-layout.js -->
    <header class="admin-navbar"></header>
    <div class="admin-container">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <main class="admin-main">
            <div class="page-header">
                <div>
                    <h1>Settings</h1>
                    <p class="subtitle">Configure system-wide cafeteria settings.</p>
                </div>
            </div>

            <div id="settingsAlert" class="alert-banner" style="display:none;"></div>

            <section class="card mb-4">
                <div class="card-header"><h3 class="section-title"><i class="fa-solid fa-user-shield"></i> Admin Profile</h3></div>
                <div class="card-body">
                    <form id="adminProfileForm">
                        <div class="form-grid">
                            <div class="form-group"><label for="adminProfileName" class="form-label">Admin Name</label><input id="adminProfileName" class="form-control" required></div>
                            <div class="form-group"><label for="adminProfileEmail" class="form-label">Email</label><input id="adminProfileEmail" type="email" class="form-control" required></div>
                            <div class="form-group"><label for="adminProfilePhone" class="form-label">Phone</label><input id="adminProfilePhone" class="form-control" required></div>
                            <div class="form-group"><label for="adminProfileAvatar" class="form-label">Profile Image URL</label><input id="adminProfileAvatar" type="url" class="form-control" placeholder="https://example.com/admin.jpg"></div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3" id="saveAdminProfileBtn"><i class="fa-solid fa-check"></i> Save Profile</button>
                    </form>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h3 class="section-title"><i class="fa-solid fa-gear"></i> System Settings</h3>
                </div>
                <div class="card-body">
                    <form id="settingsForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="cafeteriaName" class="form-label">Cafeteria Name</label>
                                <input type="text" id="cafeteriaName" class="form-control" value="Smart Cafeteria">
                            </div>
                            <div class="form-group">
                                <label for="currency" class="form-label">Currency</label>
                                <select id="currency" class="form-select">
                                    <option value="ETB">ETB - Ethiopian Birr</option>
                                    <option value="USD">USD - US Dollar</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="supportEmail" class="form-label">Support Email</label>
                                <input type="email" id="supportEmail" class="form-control" placeholder="support@smartcafeteria.com">
                            </div>
                            <div class="form-group">
                                <label for="supportPhone" class="form-label">Support Phone</label>
                                <input type="text" id="supportPhone" class="form-control" placeholder="+251 911 000 000">
                            </div>
                            <div class="form-group">
                                <label for="maxOrderQuantity" class="form-label">Max Order Quantity</label>
                                <input type="number" id="maxOrderQuantity" class="form-control" min="1" value="10">
                            </div>
                        </div>

                        <hr class="form-divider">

                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Order Availability</label>
                                <label class="switch">
                                    <input type="checkbox" id="orderAvailability" checked>
                                    <span class="switch-slider"></span>
                                    <span class="switch-caption">Customers can place orders</span>
                                </label>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Maintenance Mode</label>
                                <label class="switch">
                                    <input type="checkbox" id="maintenanceMode">
                                    <span class="switch-slider"></span>
                                    <span class="switch-caption">Temporarily disable ordering</span>
                                </label>
                            </div>
                        </div>

                        <hr class="form-divider">
                        <h4 class="settings-subtitle"><i class="fa-solid fa-shield-halved"></i> Security Settings</h4>
                        <div class="form-grid">
                            <div class="form-group"><label for="sessionTimeout" class="form-label">Session Timeout (minutes)</label><input type="number" id="sessionTimeout" class="form-control" min="5" max="1440"></div>
                            <div class="form-group"><label for="loginMaxAttempts" class="form-label">Maximum Login Attempts</label><input type="number" id="loginMaxAttempts" class="form-control" min="1" max="20"></div>
                            <div class="form-group"><label class="form-label">Two-Factor Authentication</label><label class="switch"><input type="checkbox" id="twoFactorEnabled" disabled><span class="switch-slider"></span><span class="switch-caption">Not configured for this installation</span></label></div>
                        </div>

                        <hr class="form-divider">
                        <h4 class="settings-subtitle"><i class="fa-solid fa-cart-shopping"></i> Order Settings</h4>
                        <div class="form-grid">
                            <div class="form-group"><label for="minimumOrderAmount" class="form-label">Minimum Order Amount (ETB)</label><input type="number" id="minimumOrderAmount" class="form-control" min="0" step="0.01"></div>
                            <div class="form-group"><label for="cancellationWindow" class="form-label">Cancellation Window (minutes)</label><input type="number" id="cancellationWindow" class="form-control" min="0" max="1440"></div>
                            <div class="form-group"><label for="defaultPreparationTime" class="form-label">Default Preparation Time (minutes)</label><input type="number" id="defaultPreparationTime" class="form-control" min="1" max="240"></div>
                            <div class="form-group"><label class="form-label">Order Cancellation</label><label class="switch"><input type="checkbox" id="orderCancellationEnabled"><span class="switch-slider"></span><span class="switch-caption">Allow customers to cancel eligible orders</span></label></div>
                        </div>

                        <hr class="form-divider">
                        <h4 class="settings-subtitle"><i class="fa-solid fa-credit-card"></i> Payment Settings</h4>
                        <div class="form-grid">
                            <div class="form-group"><label class="form-label">Enabled Payment Methods</label><label class="switch"><input type="checkbox" id="paymentTelebirrEnabled"><span class="switch-slider"></span><span class="switch-caption">Telebirr</span></label><label class="switch"><input type="checkbox" id="paymentChapaEnabled"><span class="switch-slider"></span><span class="switch-caption">Chapa</span></label><label class="switch"><input type="checkbox" id="paymentCbeBirrEnabled"><span class="switch-slider"></span><span class="switch-caption">CBE Birr</span></label></div>
                            <div class="form-group"><label for="paymentProvider" class="form-label">Default Payment Provider</label><select id="paymentProvider" class="form-select"><option value="chapa">Chapa</option><option value="telebirr">Telebirr</option><option value="cbe_birr">CBE Birr</option></select></div>
                            <div class="form-group"><label for="paymentStatusMode" class="form-label">Payment Status</label><select id="paymentStatusMode" class="form-select"><option value="automatic">Automatic</option><option value="manual">Manual review</option></select></div>
                        </div>

                        <hr class="form-divider">
                        <h4 class="settings-subtitle"><i class="fa-solid fa-globe"></i> Language Settings</h4>
                        <div class="form-grid">
                            <div class="form-group"><label for="defaultLanguage" class="form-label">Default System Language</label><select id="defaultLanguage" class="form-select"><option value="en">English</option><option value="am">Amharic</option></select></div>
                        </div>

                        <hr class="form-divider">
                        <h4 class="settings-subtitle"><i class="fa-solid fa-bell"></i> Notification Settings</h4>
                        <div class="form-grid">
                            <div class="form-group"><label class="switch"><input type="checkbox" id="notifyNewOrders"><span class="switch-slider"></span><span class="switch-caption">New order notifications</span></label></div>
                            <div class="form-group"><label class="switch"><input type="checkbox" id="notifyPayments"><span class="switch-slider"></span><span class="switch-caption">Payment notifications</span></label></div>
                            <div class="form-group"><label class="switch"><input type="checkbox" id="notifyLowStock"><span class="switch-slider"></span><span class="switch-caption">Low-stock notifications</span></label></div>
                            <div class="form-group"><label class="switch"><input type="checkbox" id="notifyUserAccounts"><span class="switch-slider"></span><span class="switch-caption">User/account notifications</span></label></div>
                        </div>
                    </form>
                </div>
                <div class="card-footer">
                    <button type="button" class="btn btn-secondary" id="resetSettingsBtn"><i class="fa-solid fa-rotate-left"></i> Reset to Defaults</button>
                    <button type="submit" class="btn btn-primary" id="saveSettingsBtn" form="settingsForm"><i class="fa-solid fa-check"></i> Save Settings</button>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript Files -->
    <script src="../../js/admin-api.js"></script>
    <script type="module" src="../../js/utils/i18n.js"></script>
    <script src="../../js/admin-layout.js"></script>
    <script src="../../js/admin-ui.js"></script>
    <script src="../../js/admin-settings.js"></script>

    <script>
        // Page-specific initialization
        function initPageSpecific() {
            // admin-settings.js handles initialization via its own DOMContentLoaded
        }
    </script>
</body>
</html>
